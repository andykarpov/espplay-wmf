# Build and test on every push / pull request; a tag v* publishes a release with ESPPLAY.WMF
# and the notes of that version from CHANGELOG.md.
name: build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools (sjasmplus 1.20.1, ffmpeg, z80, mutagen)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          git clone -q --depth 1 --branch v1.20.1 https://github.com/z00m128/sjasmplus.git "$RUNNER_TEMP/sjasmplus"
          make -s -C "$RUNNER_TEMP/sjasmplus" -j4 USE_LUA=0
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q z80==1.2.0 mutagen==1.48.1
      - name: Build
        run: make SJASM="$RUNNER_TEMP/sjasmplus/sjasmplus"
      - name: Test
        run: make test SJASM="$RUNNER_TEMP/sjasmplus/sjasmplus" PYTHON="$RUNNER_TEMP/venv/bin/python"
      - uses: actions/upload-artifact@v4
        with:
          name: ESPPLAY.WMF
          path: ESPPLAY.WMF
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "DEFINE VERSION \"$v\"" src/main.asm
          awk -v v="$v" '$0 ~ "^## " v " " {p = 1; next} /^## / {p = 0} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" ESPPLAY.WMF --title "ESPPLAY.WMF $v" --notes-file notes.md
